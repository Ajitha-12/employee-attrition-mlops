name: Employee Attrition - Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r practical5/requirements.txt

      # 4. Train Employee Attrition model
      - name: Train model
        run: |
          cd practical5
          python train_model.py

      # 5. Run quality gate
      - name: Run ML quality gate
        run: |
          cd practical5
          python quality_gate.py

      # 6. Run ML pipeline tests
      - name: Run ML tests
        run: |
          cd practical5
          pytest test_ml_pipeline.py

      # 7. Run Flask API tests
      - name: Run prediction API tests
        run: |
          cd practical5
          pytest test_app.py

      # 8. Create release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp practical5/app.py release_candidate/
          cp practical5/employee_attrition_model.pkl release_candidate/
          cp practical5/metrics.json release_candidate/
          cp practical5/requirements.txt release_candidate/

          echo "Employee Attrition ML Release Candidate" > release_candidate/DEPLOYMENT.txt
          echo "Created by GitHub Actions" >> release_candidate/DEPLOYMENT.txt

      # 9. Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: employee-attrition-ml-release
          path: release_candidate/
