name: Employee Attrition ML Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r practical3/requirements.txt

      - name: Train model
        working-directory: practical3
        run: python train_model.py

      - name: Check model quality
        working-directory: practical3
        run: python quality_gate.py

      - name: Run tests
        working-directory: practical3
        run: python -m unittest discover -v
