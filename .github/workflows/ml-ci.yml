
name: Employee Attrition MLOps CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Run API tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t employee-attrition-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name employee-attrition-container \
            -p 5000:5000 \
            employee-attrition-ml:${{ github.sha }}

      - name: Wait for application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs employee-attrition-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"age":30,"experience_years":5,"salary":50000,"department":"IT","education":"Bachelor","job_satisfaction":3,"work_life_balance":3,"training_hours":20}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"attrition_prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs employee-attrition-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f employee-attrition-container || true
