name: Employee Attrition ML CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r practical2/requirements.txt

      - name: Train employee attrition model
        working-directory: practical2
        run: python train_model.py

      - name: Run ML tests
        working-directory: practical2
        run: python -m unittest discover -v
